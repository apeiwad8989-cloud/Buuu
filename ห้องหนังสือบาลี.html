<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ห้องหนังสือบาลี</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --bg: #F2E9D8;
    --surface: #FFFCF5;
    --ink: #3B2A1E;
    --muted: #8A7458;
    --accent: #7A2E2E;
    --accent-ink: #FFF8EF;
    --gold: #A9792E;
    --hairline: #D8C6A0;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #1E1812; --surface: #2A221A; --ink: #EFE4D2;
      --muted: #B8A383; --accent: #C98B5E; --accent-ink: #1E1812;
      --gold: #D8B467; --hairline: #4A3B2A;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #1E1812; --surface: #2A221A; --ink: #EFE4D2;
    --muted: #B8A383; --accent: #C98B5E; --accent-ink: #1E1812;
    --gold: #D8B467; --hairline: #4A3B2A;
  }
  * , *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: 'Noto Serif Thai', 'Sarabun', serif;
  }
  a { color: inherit; }
  .site-header {
    display: flex; justify-content: space-between; align-items: flex-start;
    gap: 16px; max-width: 1100px; margin: 0 auto; padding: 40px 24px 20px;
  }
  .brand { display: flex; gap: 14px; align-items: flex-start; }
  .brand-mark { font-size: 2.2rem; line-height: 1; }
  .site-header h1 { margin: 0 0 6px; font-size: 1.7rem; font-weight: 700; }
  .tagline { margin: 0; color: var(--muted); font-size: 0.92rem; max-width: 46ch; line-height: 1.5; }
  .btn {
    display: inline-block; border-radius: 4px; padding: 10px 16px; font-size: 0.85rem;
    text-decoration: none; border: 1px solid transparent; cursor: pointer; font-family: inherit;
  }
  .btn-primary { background: var(--accent); color: var(--accent-ink); }
  .btn-ghost { background: transparent; color: var(--ink); border-color: var(--hairline); }
  .btn-sm { padding: 7px 12px; font-size: 0.8rem; }
  .btn:focus-visible, a:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .qr-panel {
    max-width: 280px; margin: 0 auto 28px; background: var(--surface);
    border: 1px solid var(--hairline); border-radius: 8px; padding: 20px; text-align: center;
  }
  .qr-panel #qrcode { display: flex; justify-content: center; }
  .qr-url { font-size: 0.72rem; color: var(--muted); word-break: break-all; margin: 12px 0; }
  main { max-width: 1100px; margin: 0 auto; }
  .book-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 24px; padding: 0 24px 64px;
  }
  .book-card {
    background: var(--surface); border: 1px solid var(--hairline); border-radius: 6px;
    padding: 12px; display: flex; flex-direction: column;
  }
  .cover {
    aspect-ratio: 3 / 4; overflow: hidden; border-radius: 4px; margin-bottom: 10px;
    background: var(--hairline); display: flex; align-items: center; justify-content: center;
  }
  .cover-img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cover-fallback { font-size: 2.4rem; color: var(--gold); font-weight: 700; }
  .book-title { font-size: 1rem; margin: 0 0 4px; line-height: 1.35; }
  .book-author { font-size: 0.85rem; color: var(--muted); margin: 0 0 10px; }
  .book-actions { margin-top: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  .empty-state {
    text-align: center; color: var(--muted); padding: 40px 24px 90px;
    max-width: 50ch; margin: 0 auto; line-height: 1.6;
  }
  footer {
    text-align: center; color: var(--muted); font-size: 0.8rem;
    padding: 20px 24px calc(32px + env(safe-area-inset-bottom, 0px));
  }
</style>
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <span class="brand-mark">🪷</span>
      <div>
        <h1>ห้องหนังสือบาลี</h1>
        <p class="tagline">คลังตำราและพระไตรปิฎกบาลี อ่านหรือดาวน์โหลดได้ฟรี ไม่ต้องสมัครสมาชิก</p>
      </div>
    </div>
    <button id="qr-btn" class="btn btn-ghost">สแกนเข้าแอป</button>
  </header>

  <div id="qr-panel" class="qr-panel" hidden>
    <div id="qrcode"></div>
    <p class="qr-url" id="qr-url"></p>
    <button id="qr-close" class="btn btn-ghost btn-sm">ปิด</button>
  </div>

  <main>
    <section id="grid" class="book-grid"></section>
    <p id="empty-state" class="empty-state">ยังไม่มีหนังสือในห้องสมุดขณะนี้ แอดมินกำลังทยอยเพิ่มตำราบาลีเข้ามา กลับมาดูใหม่ได้เร็ว ๆ นี้</p>
  </main>

  <footer>ห้องหนังสือบาลี • หนังสือทั้งหมดเพิ่มและดูแลโดยแอดมินเท่านั้น</footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    // แอดมินเพิ่มหนังสือที่นี่ (title, author ไม่บังคับ, coverUrl ไม่บังคับ, pdfUrl จำเป็น)
    var BOOKS = [];

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function renderBooks() {
      var grid = document.getElementById('grid');
      var empty = document.getElementById('empty-state');
      if (!BOOKS.length) {
        empty.style.display = 'block';
        grid.style.display = 'none';
        return;
      }
      empty.style.display = 'none';
      grid.style.display = 'grid';
      grid.innerHTML = BOOKS.map(function (b) {
        var cover = b.coverUrl
          ? '<img class="cover-img" src="' + b.coverUrl + '" alt="ปกหนังสือ ' + escapeHtml(b.title) + '">'
          : '<div class="cover-fallback">' + escapeHtml(b.title.charAt(0)) + '</div>';
        var author = b.author ? '<p class="book-author">' + escapeHtml(b.author) + '</p>' : '';
        return '<article class="book-card">'
          + '<div class="cover">' + cover + '</div>'
          + '<h2 class="book-title">' + escapeHtml(b.title) + '</h2>'
          + author
          + '<div class="book-actions">'
          + '<a class="btn btn-primary btn-sm" href="' + b.pdfUrl + '" target="_blank" rel="noopener">อ่าน</a>'
          + '<a class="btn btn-ghost btn-sm" href="' + b.pdfUrl + '" download>ดาวน์โหลด</a>'
          + '</div></article>';
      }).join('');
    }
    renderBooks();

    var qrBtn = document.getElementById('qr-btn');
    var qrPanel = document.getElementById('qr-panel');
    var qrClose = document.getElementById('qr-close');
    var qrGenerated = false;
    qrBtn.addEventListener('click', function () {
      qrPanel.hidden = false;
      document.getElementById('qr-url').textContent = window.location.href;
      if (!qrGenerated && window.QRCode) {
        new QRCode(document.getElementById('qrcode'), {
          text: window.location.href, width: 180, height: 180,
          colorDark: '#3B2A1E', colorLight: '#FFFCF5'
        });
        qrGenerated = true;
      }
    });
    qrClose.addEventListener('click', function () { qrPanel.hidden = true; });
  </script>
</body>
</html>
